name: Image
# Builds the target's Docker image, checks it runs the way jam-fuzzing runs any Docker target
# (scripts/target.py: --user uid:gid, --init, data dir mounted at /tmp/jam_fuzz, socket
# /tmp/jam_fuzz/fuzz.sock, JAM_FUZZ* variables) and answers a recorded 0.8.0 session as recorded,
# then pushes it to ghcr.io (main: latest + short SHA; v* tags: the tag). PRs touching the image
# build and check it without pushing. Separate from ci.yml so PR CI stays fast.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - scripts/entrypoint.sh
      - .github/workflows/image.yml
permissions:
  contents: read
  packages: write
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  IMAGE: ghcr.io/ascrivener/jam-lean-target
  JAM_FUZZING_REV: cddba17d4a0798a7c794e003df0c21140e1fc09a
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (linux/amd64, GHA layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: jam-lean-target:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Fetch the 0.8.0 fuzzer sessions
        run: git clone -q https://github.com/jam-conformance/jam-fuzzing vendor/jam-fuzzing && git -C vendor/jam-fuzzing checkout -q "$JAM_FUZZING_REV"
      - name: Conformance check (run as jam-fuzzing runs Docker targets, drive recorded sessions)
        run: |
          set -eu
          D="$RUNNER_TEMP/jam_fuzz"; mkdir -p "$D"; chmod 0777 "$D"
          docker run -d --name jlt --init --platform linux/amd64 --user "$(id -u):$(id -g)" \
            -v "$D:/tmp/jam_fuzz" \
            -e JAM_FUZZ=1 -e JAM_FUZZ_SPEC=tiny -e JAM_FUZZ_DATA_PATH=/tmp/jam_fuzz \
            -e JAM_FUZZ_SOCK_PATH=/tmp/jam_fuzz/fuzz.sock -e JAM_FUZZ_LOG_LEVEL=info \
            jam-lean-target:ci
          for i in $(seq 1 60); do [ -S "$D/fuzz.sock" ] && break; sleep 1; done
          [ -S "$D/fuzz.sock" ] || { docker logs jlt; exit 1; }
          docker exec jlt chmod 0666 /tmp/jam_fuzz/fuzz.sock
          check() {
            out=$(python3 scripts/drive.py "$1" --sock "$D/fuzz.sock" --quiet); echo "$out"
            last=$(echo "$out" | tail -1)
            n=$(ls "$1" | grep -c '_fuzzer_.*\.bin$')
            [ "$last" = "$n/$n as recorded" ] || { echo "::error::$1: $last (expected $n/$n)"; docker logs jlt; exit 1; }
          }
          check vendor/jam-fuzzing/fuzz-proto/examples/0.8.0/forks
          check vectors/refine/0.8.0-tiny
          docker rm -f jlt
      - name: Image tags
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push (same build, from the layer cache)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
