name: polkajam feed
# Manual only (Actions → "polkajam feed" → Run workflow); normal CI does not run it.
# Downloads a PolkaJam release from paritytech/polkajam-releases, records what its binaries can
# export (--help of every executable, the dev chain spec), runs polkajam-testnet with JIP-3
# telemetry going to jam-telemetry-dumper, records its best chain over JIP-2 (slot, header hash,
# posterior state root), and uploads everything as the artifact `polkajam-feed`. See
# docs/shadow.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: polkajam-releases tag (e.g. v0.8.0 or a nightly tag)
        default: v0.8.0
      blocks:
        description: run the testnet until this slot
        default: '100'
      rpc:
        description: JIP-2 RPC endpoint of the testnet
        default: ws://127.0.0.1:19800
      testnet_args:
        description: extra arguments for polkajam-testnet
        default: ''
      work_items:
        description: work items to submit to the Bootstrap service (jamt item) while the chain runs
        default: '10'
      peer:
        description: JAM-NP address (UDP) of the node to fetch blocks from
        default: 127.0.0.1:40000
permissions:
  contents: read
jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      OUT: ${{ github.workspace }}/feed
      TAG: ${{ inputs.tag }}
      BLOCKS: ${{ inputs.blocks }}
      RPC: ${{ inputs.rpc }}
      TESTNET_ARGS: ${{ inputs.testnet_args }}
      WORK_ITEMS: ${{ inputs.work_items }}
      PEER: ${{ inputs.peer }}
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lake-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Build the target
        run: lake build jam-lean-target
      - name: Download the release
        run: |
          mkdir -p "$OUT/help" pj
          gh release view "$TAG" -R paritytech/polkajam-releases --json tagName,name,publishedAt,assets \
            --jq '.tagName, .name, .publishedAt, (.assets[] | "\(.name)\t\(.size)")' | tee "$OUT/release.txt"
          # Linux x86-64 assets only, when the names say so; otherwise all of them.
          names=$(gh release view "$TAG" -R paritytech/polkajam-releases --json assets --jq '.assets[].name')
          pick=$(echo "$names" | grep -iE 'linux' | grep -iE 'x86_64|amd64|x64' || true)
          [ -n "$pick" ] || pick=$names
          for n in $pick; do gh release download "$TAG" -R paritytech/polkajam-releases -p "$n" -D pj; done
          cd pj
          for f in *; do
            case "$f" in
              *.tar.gz|*.tgz|*.tar.xz|*.tar.zst|*.tar) tar xf "$f" ;;
              *.zip) unzip -q "$f" ;;
            esac
          done
          find . -type f -exec file {} + | grep -i 'ELF' | cut -d: -f1 | tee "$OUT/executables.txt"
          xargs -a "$OUT/executables.txt" chmod +x
      - name: Record what each binary offers
        run: |
          while read -r x; do
            n=$(basename "$x")
            (timeout 20 "pj/$x" --help || true) > "$OUT/help/$n.txt" 2>&1
            # one level of subcommands (clap style: an indented word, then its description)
            for sub in $(sed -n '/^Commands:/,/^$/p' "$OUT/help/$n.txt" | awk 'NR>1 && $1 != "help" {print $1}'); do
              (timeout 20 "pj/$x" "$sub" --help || true) > "$OUT/help/$n.$sub.txt" 2>&1
            done
          done < "$OUT/executables.txt"
          grep -il -E 'export|dump|block|state' "$OUT"/help/*.txt | tee "$OUT/help-mentions-export.txt" || true
      - name: Dump the dev chain spec (genesis)
        run: |
          pj=$(grep -E '(^|/)polkajam$' "$OUT/executables.txt" | head -1)
          (timeout 60 "pj/$pj" --chain dev dump-spec "$OUT/dev-spec.json" || true) 2>&1 | tee "$OUT/dump-spec.log"
          # genesis.bin for scripts/shadow.py's dump feed: E(genesis header, genesis key-values)
          python3 scripts/spec_genesis.py "$OUT/dev-spec.json" "$OUT/dump/genesis.bin" || true
      - name: Run the testnet and record its chain over JIP-2
        run: |
          # PolkaVM's Linux sandbox needs unprivileged userfaultfd and user namespaces.
          sudo sysctl -w vm.unprivileged_userfaultfd=1 kernel.apparmor_restrict_unprivileged_userns=0
          pip install -q websockets aioquic
          tn=$(grep -E '(^|/)polkajam-testnet$' "$OUT/executables.txt" | head -1)
          td=$(grep -E '(^|/)jam-telemetry-dumper$' "$OUT/executables.txt" | head -1)
          [ -n "$tn" ] || { echo "no polkajam-testnet in the release"; exit 1; }
          mkdir -p run && cd run
          if [ -n "$td" ]; then
            "../pj/$td" --port 19900 > "$OUT/telemetry.log" 2>&1 &
            echo $! > ../telemetry.pid; sleep 2
            TESTNET_ARGS="--telemetry 127.0.0.1:19900 $TESTNET_ARGS"
          fi
          "../pj/$tn" $TESTNET_ARGS > "$OUT/testnet.log" 2>&1 &
          echo $! > ../testnet.pid
          sleep 20; (ss -ltnup || true) > "$OUT/listening.txt"
          # A workload so blocks carry guarantees, assurances and accumulation: work items for the
          # Bootstrap service (0) and a transfer, spread over the run.
          jamt="../pj/$(grep -E '(^|/)jamt$' "$OUT/executables.txt" | head -1)"
          ( for i in $(seq 1 "$WORK_ITEMS"); do
              echo "== item $i"; timeout 120 "$jamt" --rpc "$RPC" item 0 "shadow-$i" 2>&1 || echo "item $i: exit $?"
              [ "$i" = 2 ] && { echo "== transfer"; timeout 120 "$jamt" --rpc "$RPC" transfer 0 1 2>&1 || echo "transfer: exit $?"; }
              sleep 12
            done ) > "$OUT/workload.log" 2>&1 &
          python3 ../scripts/polkajam_chain.py --rpc "$RPC" --blocks "$BLOCKS" --pid "$(cat ../testnet.pid)" \
            --timeout 2400 --out "$OUT/chain.json" 2>&1 | tee "$OUT/chain.log"
          [ "${PIPESTATUS[0]}" = 0 ] || exit 1
          # The blocks themselves, over JAM-NP (CE 128 block requests), while the testnet still runs.
          python3 ../scripts/jamnp_blocks.py --peer "$PEER" --genesis "$OUT/dump/genesis.bin" \
            --chain "$OUT/chain.json" --out "$OUT/dump" 2>&1 | tee "$OUT/jamnp.log"
          exit "${PIPESTATUS[0]}"
      - name: Shadow the chain (scripts/shadow.py dump)
        run: |
          set +e
          python3 scripts/shadow.py dump "$OUT/dump" --continue --known scripts/shadow-known.txt \
            --out "$OUT/shadow" --target-log "$OUT/shadow-target.log" > "$OUT/shadow.log" 2>&1
          # Results stay in the artifact (shadow.log), not in the job log.
          echo "exit $?" >> "$OUT/shadow.log"
      - name: Collect what the testnet wrote
        if: always()
        run: |
          kill "$(cat testnet.pid 2>/dev/null)" "$(cat telemetry.pid 2>/dev/null)" 2>/dev/null || true; sleep 3
          (find run -type f -printf '%s\t%p\n' 2>/dev/null | sort -k2 || true) > "$OUT/files.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polkajam-feed
          path: feed
          retention-days: 14
