name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Forbidden constructs
        run: ./scripts/check-forbidden.sh
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Build (PVM and JAM of jam-lean, never Services)
        run: lake build jam-lean-target
      - name: Ring root and ring VRF vectors (JamCrypto.Ring; v0.8.0 from tests/gen, v0.8.1 from the VRF spec Draft 35)
        run: lake build ringtest && .lake/build/bin/ringtest
      - name: Crypto test vectors (Ed25519, Bandersnatch IETF VRF; v0.8.1 Thin and Pedersen VRF)
        run: lake build cryptotest && .lake/build/bin/cryptotest
      - name: Fetch the 0.8.0 fuzzer sessions
        run: git clone -q https://github.com/jam-conformance/jam-fuzzing vendor/jam-fuzzing && git -C vendor/jam-fuzzing checkout -q cddba17d4a0798a7c794e003df0c21140e1fc09a
      - name: Smoke test (session replay; known gap at slot 25, finding F2, see docs/gaps.md)
        run: .lake/build/bin/jam-lean-target session vendor/jam-fuzzing/fuzz-proto/examples/0.8.0/no_forks | tail -1
      - name: Shadow driver on the recorded no_forks session (fails on a divergence not in scripts/shadow-known.txt)
        run: python3 scripts/shadow.py session vendor/jam-fuzzing/fuzz-proto/examples/0.8.0/no_forks --quiet --continue --known scripts/shadow-known.txt --out /tmp/shadow
      - name: Block crafter (tests/craft/epoch.txt; replayed against the model's own answers)
        run: .lake/build/bin/jam-lean-target craft tests/craft/epoch.txt /tmp/craft && .lake/build/bin/jam-lean-target session /tmp/craft
      - name: Block-level vectors (vectors/blocks, GP v0.8.0 post-states; regenerated byte for byte)
        run: |
          .lake/build/bin/jam-lean-target trace vectors/blocks/*/
          ./scripts/blocks-vectors.sh /tmp/blocks && diff -r vectors/blocks /tmp/blocks -x README.md
      - name: PVM runner on the official PVM vectors (koute/jamtestvectors pvm/programs, GP 0.8.0)
        run: |
          git clone -q --filter=blob:none --no-checkout https://github.com/koute/jamtestvectors vendor/jamtestvectors
          git -C vendor/jamtestvectors checkout -q 6bf3768e5b37bbe4ca5d6e1306284ecb27c0198f
          lake build pvmrun && .lake/build/bin/pvmrun check vendor/jamtestvectors/pvm/programs
      - name: PVM edge-case vectors (vectors/pvm, GP v0.8.0 results)
        run: .lake/build/bin/pvmrun check vectors/pvm
      - name: Refine vectors (vectors/refine, GP v0.8.0 work reports)
        run: .lake/build/bin/jam-lean-target session vectors/refine/*/
