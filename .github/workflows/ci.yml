name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Forbidden constructs
        run: ./scripts/check-forbidden.sh
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Build (PVM, JAM and JamCrypto of jam-lean, never Services)
        run: lake build jam-lean-target
      # The genesis the generators start from (converted to GP v0.8.1 form, JamTarget/Upgrade.lean).
      # The recorded 0.8.0 sessions (forks, no_forks) and the shadow driver on them are GP v0.8.0
      # data: suspended until 0.8.1 fuzzer data exists (docs/gaps.md).
      - name: Fetch the 0.8.0 fuzzer sessions (genesis only)
        run: git clone -q https://github.com/jam-conformance/jam-fuzzing vendor/jam-fuzzing && git -C vendor/jam-fuzzing checkout -q cddba17d4a0798a7c794e003df0c21140e1fc09a
      - name: Block crafter (tests/craft/epoch.txt; replayed against the model's own answers)
        run: .lake/build/bin/jam-lean-target craft tests/craft/epoch.txt /tmp/craft && .lake/build/bin/jam-lean-target session /tmp/craft
      - name: Block-level vectors (vectors/blocks, GP v0.8.1 post-states; regenerated byte for byte)
        run: |
          .lake/build/bin/jam-lean-target trace vectors/blocks/*/
          ./scripts/blocks-vectors.sh /tmp/blocks && diff -r vectors/blocks /tmp/blocks -x README.md
      - name: PVM runner on the official PVM vectors (koute/jamtestvectors pvm/programs)
        run: |
          git clone -q --filter=blob:none --no-checkout https://github.com/koute/jamtestvectors vendor/jamtestvectors
          git -C vendor/jamtestvectors checkout -q 6bf3768e5b37bbe4ca5d6e1306284ecb27c0198f
          lake build pvmrun && .lake/build/bin/pvmrun check vendor/jamtestvectors/pvm/programs
      - name: PVM edge-case vectors (vectors/pvm, GP v0.8.0 results)
        run: .lake/build/bin/pvmrun check vectors/pvm
      - name: Refine vectors (vectors/refine, GP v0.8.1 work reports; regenerated byte for byte)
        run: |
          .lake/build/bin/jam-lean-target session vectors/refine/*/
          lake build refinegen && .lake/build/bin/refinegen vendor/jam-fuzzing/fuzz-proto/examples/0.8.0/no_forks/00000001_fuzzer_initialize.bin /tmp/refine > /dev/null
          diff -r vectors/refine/0.8.1-tiny /tmp/refine
